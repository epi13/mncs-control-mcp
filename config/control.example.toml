[server]
name = "mncs-control-mcp"
# Audit data is outside the exposed workspace and created mode 0600.
audit_path = "~/.local/state/mncs-control-mcp/audit.jsonl"

[workspace]
root = "~/Documents/Projects"
protect_root = true
default_scope = "project"
allow_workspace_scope = true
allow_terminal = true
terminal_network_default = false
terminal_network_allowed = true

[sandbox]
backend = "auto"
require_real_sandbox = true
home = "~/.local/share/mncs-control-mcp/sandbox-home"
# Optional additional read-only host tool trees. The default auto-detects
# ~/.local/bin, ~/.cargo/bin, and ~/.rustup when present.
# tool_paths = ["~/.local/bin", "~/.cargo/bin", "~/.rustup"]

[terminal]
default_timeout_seconds = 120
max_timeout_seconds = 1800
max_output_bytes = 1048576
max_concurrent_jobs = 4
job_retention_seconds = 86400
job_state_path = "~/.local/state/mncs-control-mcp/jobs.json"

# Safe non-secret overrides only. Secret-like variable names are rejected.
[terminal.environment]
PIP_DISABLE_PIP_VERSION_CHECK = "1"

[git]
allow_fetch = true
allow_pull = true
allow_push = true
allow_clone = true
allow_force_push = false
use_ssh_agent = true

[limits]
max_response_bytes = 2097152
max_file_bytes = 4194304
max_listing_entries = 2000
max_search_results = 500

[mncs.repos]
local_harness = "epi13-local-harness"
fabric = "mncs-fabric"
forge = "mncs-forge-mcp"
language = "mncs-language"
standard = "machine-native-complexity-standard"
commons = "MNCS-Commons"
reference_studies = "mncs-reference-studies"

[integration]
# harness_config = "~/.config/epi13-local-harness/config.toml"
fabric_mode = "service"
fabric_socket = "~/.local/state/mncs-fabric/controller.sock"
fabric_service_timeout_seconds = 5.0
fabric_consumer_identity = "mncs-control-mcp"
commons_socket = "~/.local/state/mncs-commons/commons.sock"
commons_service_timeout_seconds = 5.0
fabric_execution_mode = "unavailable-until-service-support"
# Service mode reads the Fabric-owned fleet and does not copy workers.json,
# trust state, certificates, or keys into Control. For explicit compatibility:
# fabric_mode = "transitional"
# fabric_execution_mode = "embedded-direct-compatibility"
# fabric_registry = "~/.local/state/mncs-control-mcp/fabric/workers.json"
# fabric_state = "~/.local/state/mncs-control-mcp/fabric.jsonl"
fabric_controller_id = "epi13-local-harness"
forge_config_name = "mncs-forge.toml"
# Optional explicit MCP probe paths. When omitted, Control uses the Forge
# checkout's .venv entry point and the migrated reference-studies config.
# forge_mcp_executable = "~/Documents/Projects/mncs-forge-mcp/scripts/codex-mcp"
# forge_mcp_config = "~/Documents/Projects/mncs-reference-studies/mncs-forge.toml"
